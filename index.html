<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterWorld - Outreach Sender</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .card { max-width: 650px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #2c3e50; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #34495e; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 120px; resize: vertical; }
    .hint { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
    button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; }
    button:hover { background: #219150; }
    #log { margin-top: 20px; padding: 10px; background: #eef2f5; border-radius: 6px; font-family: monospace; font-size: 13px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="card">
  <h2>BetterWorld Outreach Sender</h2>
  
  <label for="scriptUrl">Google Web App URL</label>
  <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="hint">Your deployed Google Apps Script Web App URL.</div>

  <label for="recipients">Recipients (Single or Comma-Separated)</label>
  <input type="text" id="recipients" placeholder="email1@domain.com, email2@domain.com">

  <label for="subject">Email Subject</label>
  <input type="text" id="subject" placeholder="In-game billboard preview for [Brand Name]">

  <label for="message">Email Body</label>
  <textarea id="message" placeholder="Hi team, I am Itamar..."></textarea>

  <button onclick="sendBulkEmails()">Send Emails</button>

  <div id="log">Logs will appear here...</div>
</div>

<script>
  // Auto-fill saved Script URL
  document.getElementById('scriptUrl').value = localStorage.getItem('bw_script_url') || '';

  async function sendBulkEmails() {
    const scriptUrl = document.getElementById('scriptUrl').value.trim();
    const rawEmails = document.getElementById('recipients').value;
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    const logDiv = document.getElementById('log');

    if (!scriptUrl) {
      alert("Please paste your Google Apps Script Web App URL!");
      return;
    }

    if (!rawEmails || !subject || !message) {
      alert("Please fill in all fields!");
      return;
    }

    localStorage.setItem('bw_script_url', scriptUrl);

    const emailList = rawEmails.split(',').map(e => e.trim()).filter(e => e.length > 0);
    logDiv.innerHTML = `Starting batch send to ${emailList.length} address(es)...<br>`;

    for (let i = 0; i < emailList.length; i++) {
      const targetEmail = emailList[i];
      
      try {
        logDiv.innerHTML += `Sending to ${targetEmail}... `;
        
        const endpoint = `${scriptUrl}?to=${encodeURIComponent(targetEmail)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.status === "success") {
          logDiv.innerHTML += `<span style="color: green;">SUCCESS</span><br>`;
        } else {
          logDiv.innerHTML += `<span style="color: red;">FAILED (${data.message})</span><br>`;
        }
      } catch (error) {
        logDiv.innerHTML += `<span style="color: red;">FAILED (${error.message})</span><br>`;
      }

      // 3-second delay between batch emails
      await new Promise(resolve => setTimeout(resolve, 3000));
    }

    logDiv.innerHTML += `<b>Batch process complete!</b>`;
  }
</script>

</body>
</html>
