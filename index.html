<script>
  // ⚠️ Important: Replace 're_xxxxxxxxx' below with your actual Resend API Key
  const RESEND_API_KEY = 're_3wH1ayXB_9ynyTEXsgSrKevW2uacoAcQU';

  async function sendBulkEmails() {
    const rawEmails = document.getElementById('recipients').value;
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    const logDiv = document.getElementById('log');

    if (RESEND_API_KEY === 're_xxxxxxxxx') {
      alert("Please replace 're_xxxxxxxxx' with your actual Resend API Key in the script!");
      return;
    }

    if (!rawEmails || !subject || !message) {
      alert("Please fill in all fields!");
      return;
    }

    // Split comma-separated list into array of emails
    const emailList = rawEmails.split(',').map(e => e.trim()).filter(e => e.length > 0);

    logDiv.innerHTML = `Starting batch send to ${emailList.length} address(es)...<br>`;

    for (let i = 0; i < emailList.length; i++) {
      const targetEmail = emailList[i];
      
      try {
        logDiv.innerHTML += `Sending to ${targetEmail}... `;
        
        // Send email via Resend HTTP API
        const response = await fetch('https://api.resend.com/emails', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${RESEND_API_KEY}`
          },
          body: JSON.stringify({
            from: 'BetterWorld <onboarding@resend.dev>', // Resend's default free sending domain
            to: [targetEmail],
            subject: subject,
            html: `<p>${message.replace(/\n/g, '<br>')}</p>`, // Formats line breaks properly
            reply_to: 'mariligames01@gmail.com'
          })
        });

        const data = await response.json();

        if (response.ok) {
          logDiv.innerHTML += `<span style="color: green;">SUCCESS</span><br>`;
        } else {
          logDiv.innerHTML += `<span style="color: red;">FAILED (${data.message || 'Error sending email'})</span><br>`;
        }
      } catch (error) {
        logDiv.innerHTML += `<span style="color: red;">FAILED (${error.message})</span><br>`;
      }

      // 3-second delay between batch emails to keep rate limits safe
      await new Promise(resolve => setTimeout(resolve, 3000));
    }

    logDiv.innerHTML += `<b>Batch process complete!</b>`;
  }
</script>
